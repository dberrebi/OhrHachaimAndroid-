name: Android

# Pull requests are built through pull_request; push only builds main, so one push does not
# start two identical runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build and test only: read the code, nothing else. This workflow never sees the Play secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest already has the Android SDK. android-actions/setup-android@v3
      # still asks sdkmanager for the removed "tools" package and fails before the build.
      - name: Install Android SDK 36
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble and test
        run: ./gradlew assembleDebug test --stacktrace
